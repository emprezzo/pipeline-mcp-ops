[project]
name = "pipeline-ops-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Emily Zhou", email = "emilyzh02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2,<3",
    "pydantic>=2.14.3",
]

[project.scripts]
pipeline-ops-mcp = "pipeline_ops_mcp:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
